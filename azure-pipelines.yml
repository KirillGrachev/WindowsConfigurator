# Azure DevOps Pipelines: те же проверки, что и в GitHub Actions.
# Матрица: Windows PowerShell 5.1 (реальная проверка совместимости),
# PowerShell 7 + Pester 6, Linux + Pester 5.
trigger:
  branches:
    include: [ main, master, develop ]

pool:
  vmImage: 'windows-latest'

strategy:
  matrix:
    win_ps51_pester5:
      imageName: 'windows-latest'
      pwshExe: 'powershell'
      pesterVersion: '5.7.1'
      withCoverage: 'false'
    win_ps7_pester6:
      imageName: 'windows-latest'
      pwshExe: 'pwsh'
      pesterVersion: '6.2.0'
      withCoverage: 'true'
    linux_ps7_pester5:
      imageName: 'ubuntu-latest'
      pwshExe: 'pwsh'
      pesterVersion: '5.7.1'
      withCoverage: 'false'

steps:
  - task: PowerShell@2
    displayName: 'Проверка кодировок'
    inputs:
      targetType: inline
      script: |
        $changed = ./tools/Set-ProjectEncoding.ps1 -Check
        if ($changed.Count -gt 0) { throw "Кодировки не соответствуют стандарту: $($changed -join ', ')" }

  - task: PowerShell@2
    displayName: 'PSScriptAnalyzer'
    inputs:
      targetType: inline
      script: |
        Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
        Import-Module PSScriptAnalyzer
        $issues = @()
        foreach ($target in @('./functions', './tools', './tests', './Configure-Windows.ps1')) {
          $issues += @(Invoke-ScriptAnalyzer -Path $target -Recurse -Settings ./ScriptAnalyzerSettings.psd1)
        }
        if ($issues.Count -gt 0) { $issues | Format-Table | Out-String | Write-Host; throw "PSScriptAnalyzer: $($issues.Count) замечаний" }

  - task: PowerShell@2
    displayName: 'Валидация конфигурации'
    inputs:
      targetType: inline
      script: |
        & ./Configure-Windows.ps1 -ValidateConfig
        if ($LASTEXITCODE -ne 0) { throw "Конфигурация не прошла валидацию по схеме" }

  - task: PowerShell@2
    displayName: 'Тесты Pester'
    inputs:
      targetType: inline
      pwsh: false
      script: |
        $parameters = @('-PesterVersion', '$(pesterVersion)', '-OutputFile', 'testResults.xml')
        if ('$(withCoverage)' -eq 'true') { $parameters += @('-WithCoverage', '-MinimumCoverage', '80') }
        & ./tests/Run-Tests.ps1 @parameters
        exit $LASTEXITCODE

  - task: PublishTestResults@2
    displayName: 'Публикация результатов'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: NUnit
      testResultsFiles: 'testResults.xml'
      testRunTitle: 'WindowsConfigurator ($(Agent.JobName))'

  - task: PublishCodeCoverageResults@2
    displayName: 'Публикация покрытия'
    condition: and(succeededOrFailed(), eq(variables['withCoverage'], 'true'))
    inputs:
      summaryFileLocation: 'tests/coverage.xml'

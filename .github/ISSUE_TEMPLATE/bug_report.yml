name: Bug report
description: Report a problem with the configurator
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not attach production configurations, KMS keys or UNC paths.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A short description of the problem and the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag or commit, for example v2.1.0.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows 10/11, build, Windows PowerShell 5.1 or PowerShell 7.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: A log excerpt with secrets and paths removed.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I confirmed that this report contains no secrets or corporate data.
          required: true
        - label: The problem reproduces in TestMode (`-TestMode`) when possible.

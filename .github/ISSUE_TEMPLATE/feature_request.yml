name: Feature request
description: Suggest an improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should the change solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? If the configuration changes, describe the new fields.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else did you consider, and why is it not a good fit?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Configuration / JSON Schema
        - label: Application installation
        - label: Policies and registry
        - label: Menu and UX
        - label: CI / documentation
